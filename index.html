<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลขยะ อบต.ศิลาลอย</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f9f9f9; }
    h2 { color: #333; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #4CAF50; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    button { padding: 6px 12px; margin-right: 5px; cursor: pointer; }
    .loading { font-size: 16px; color: #666; margin-top: 10px; }
  </style>
</head>
<body onload="loadWasteData()">

  <h2>ระบบจัดการข้อมูลขยะ อบต.ศิลาลอย</h2>
  <div id="loadingStatus" class="loading">กำลังโหลดข้อมูล...</div>

  <table id="wasteTable" style="display:none;">
    <thead>
      <tr>
        <th>ลำดับ</th>
        <th>วันที่</th>
        <th>หมู่บ้าน</th>
        <th>บ้านเลขที่</th>
        <th>ชื่อ-นามสกุล</th>
        <th>เบอร์โทร</th>
        <th>จำนวนเงิน</th>
        <th>รหัสถัง</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="dataTableBody">
      <!-- ข้อมูลจะถูกโหลดมาแสดงตรงนี้อัตโนมัติ -->
    </tbody>
  </table>

  <script>
    // URL Web App ของ Google Apps Script ที่คุณ Deploy ล่าสุด
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw01amYiV8v-fau5VFqOYg1s_ew7WPCW4vRM_Yp0tZ0LAQsUsO4_jw0VnSeva9aHD8N/exec";

    // 1. ฟังก์ชันดึงข้อมูลทั้งหมดมาแสดงในตาราง
    async function loadWasteData() {
      const loadingEl = document.getElementById("loadingStatus");
      const tableEl = document.getElementById("wasteTable");

      try {
        loadingEl.style.display = "block";
        tableEl.style.display = "none";

        const response = await fetch(WEB_APP_URL);
        const result = await response.json();

        if (result.status === "success") {
          console.log("โหลดข้อมูลสำเร็จ:", result.total, "รายการ");
          renderTable(result.data);
          loadingEl.style.display = "none";
          tableEl.style.display = "table";
        } else {
          alert("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: " + result.message);
          loadingEl.style.display = "none";
        }
      } catch (error) {
        console.error("Connection Error:", error);
        loadingEl.innerText = "ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ กรุณาตรวจสอบอินเทอร์เน็ตหรือลิงก์ Web App";
      }
    }

    // 2. ฟังก์ชันสร้างแถวข้อมูลลงในตาราง HTML
    function renderTable(dataArray) {
      const tbody = document.getElementById("dataTableBody");
      tbody.innerHTML = "";

      if (dataArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">ไม่พบข้อมูลในระบบ</td></tr>`;
        return;
      }

      dataArray.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.date}</td>
          <td>${item.village}</td>
          <td>${item.houseNo}</td>
          <td>${item.fullName}</td>
          <td>${item.phone}</td>
          <td>${item.amount.toLocaleString()} บาท</td>
          <td>${item.binId}</td>
          <td>
            <button onclick="deleteRecord('${item.sheetName}', ${item.rowIndex})" style="background-color: #ff4d4d; color: white; border: none; border-radius: 4px;">ลบ</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. ฟังก์ชันลบข้อมูล
    async function deleteRecord(sheetName, rowIndex) {
      if (!confirm("คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลรายการนี้?")) return;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ 
            action: "delete", 
            sheetName: sheetName, 
            id: rowIndex 
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("ลบข้อมูลสำเร็จ");
          loadWasteData(); // โหลดข้อมูลใหม่ทันทีหลังลบเสร็จ
        } else {
          alert("ลบไม่สำเร็จ: " + result.message);
        }
      } catch (err) {
        console.error("Delete Error:", err);
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย");
      }
    }
  </script>

</body>
</html>
