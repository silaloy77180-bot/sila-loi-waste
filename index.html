  <!-- MODAL ดูที่มาของตัวเลข -->
  <div id="sourceModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">

        <div>
          <h3 id="sourceModalTitle" class="text-lg font-bold text-emerald-400">รายละเอียดข้อมูลที่มา</h3>
          <p id="sourceModalSubtitle" class="text-xs text-slate-400 mt-0.5"></p>
        </div>
        <button type="button" onclick="closeSourceModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>

              <th class="p-3 text-right">ค่าเก็บขน</th>
              <th class="p-3 text-right">ค่ากำจัด</th>
              <th class="p-3 text-right">ส่วนลด</th>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-nY_T6hW0hS7Q_W0r2Z9lX3nV8mP1kL4jH6gF5dS2aQ9wE7rT0yU3iO/exec";
    const ADMIN_PASSWORDS = {
      "Admin 1": "1234",
      "Admin 2": "1234"
    };

    const VILLAGE_NAMES = {
      "1": "หมู่ 1 บ้านห้วยขวาง",
      "2": "หมู่ 2 บ้านนาปุ่ม",
      "3": "หมู่ 3 บ้านหนองคาง",
      "4": "หมู่ 4 บ้านหนองหญ้าปล้อง",
      "5": "หมู่ 5 บ้านลาดวิถี",
      "6": "หมู่ 6 บ้านเขาโป่ง",
      "7": "หมู่ 7 บ้านหนองกลางดง",
      "8": "หมู่ 8 บ้านเกาะนาน้อย",
      "9": "หมู่ 9 บ้านเขาน้อยห้วยตามา"
    };

    const STANDARD_TYPES = [
      "ครัวเรือน",
      "บริษัท/สำนักงาน/โรงงาน",
      "ร้านค้า/ร้านอาหาร",
      "อนามัย",
      "โรงเรียน",
      "วัด",
      "บ้านพัก/ห้องเช่า",
      "อื่นๆ"
    ];

    let allRecords = [];
    let allLogs = [];
    let currentPage = 1;
    const rowsPerPage = 20;
    let renderTimeout = null;
    let currentRole = "Admin 1";

    function togglePasswordVisibility() {
      const input = document.getElementById("adminPassword");
      const icon = document.getElementById("passEyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function handleLogin() {
      const role = document.getElementById("adminRole").value;
      const pass = document.getElementById("adminPassword").value.trim();
      const errEl = document.getElementById("loginError");

      if (ADMIN_PASSWORDS[role] && pass === ADMIN_PASSWORDS[role]) {
        currentRole = role;
        errEl.classList.add("hidden");
        document.getElementById("loginOverlay").classList.add("hidden");
        document.getElementById("mainAppContent").classList.remove("hidden");
        document.getElementById("currentRoleDisplay").textContent = currentRole;
        sessionStorage.setItem("silaloyLoggedIn", "true");
        sessionStorage.setItem("silaloyRole", currentRole);
        loadData(true);
      } else {
        errEl.classList.remove("hidden");
      }
    }

    function logout() {
      sessionStorage.removeItem("silaloyLoggedIn");
      sessionStorage.removeItem("silaloyRole");
      document.getElementById("mainAppContent").classList.add("hidden");
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("adminPassword").value = "";
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("silaloyLoggedIn") === "true") {
        currentRole = sessionStorage.getItem("silaloyRole") || "Admin 1";
        document.getElementById("adminRole").value = currentRole;
        document.getElementById("currentRoleDisplay").textContent = currentRole;
        document.getElementById("loginOverlay").classList.add("hidden");
        document.getElementById("mainAppContent").classList.remove("hidden");
        loadData(false);
      }

      document.getElementById("addForm").addEventListener("submit", handleAddSubmit);
      document.getElementById("editForm").addEventListener("submit", handleEditSubmit);
      document.getElementById("cancelForm").addEventListener("submit", handleCancelSubmit);
    });

    function switchPage(page) {
      document.querySelectorAll(".page-content").forEach(el => el.classList.add("hidden"));
      document.getElementById("page-" + page).classList.remove("hidden");

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.remove("bg-emerald-600", "text-white", "shadow-lg", "shadow-emerald-600/20");
        btn.classList.add("text-slate-400", "hover:bg-slate-800", "hover:text-white");
      });
      const activeBtn = document.getElementById("menu-" + page);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-400", "hover:bg-slate-800", "hover:text-white");
        activeBtn.classList.add("bg-emerald-600", "text-white", "shadow-lg", "shadow-emerald-600/20");
      }

      const titles = {
        dashboard: "ภาพรวมระบบ (Dashboard)",
        management: "ลงทะเบียน & รายชื่อทั้งหมด",
        analytics: "สรุปรายหมู่บ้าน",
        history: "ประวัติแก้ไข & ยกเลิก"
      };
      document.getElementById("pageTitle").textContent = titles[page] || "ระบบจัดการขยะ";
    }

    function toggleCustomTypeInput(mode) {
      const sel = document.getElementById(mode === "add" ? "customerTypeSelect" : "editCustomerTypeSelect");
      const detail = document.getElementById(mode === "add" ? "customerTypeDetail" : "editCustomerTypeDetail");
      if (sel.value === "อื่นๆ" || sel.value === "บริษัท/สำนักงาน/โรงงาน") {
        detail.classList.remove("hidden");
      } else {
        detail.classList.add("hidden");
        detail.value = "";
      }
    }

    function getSelectedCustomerType(mode) {
      const sel = document.getElementById(mode === "add" ? "customerTypeSelect" : "editCustomerTypeSelect");
      const detail = document.getElementById(mode === "add" ? "customerTypeDetail" : "editCustomerTypeDetail");
      const customText = detail.value.trim();
      if (customText) return customText;
      return sel.value;
    }

    function calcFormTotal(mode) {
      const cId = mode === "add" ? "collectionFee" : "editCollectionFee";
      const dId = mode === "add" ? "disposalFee" : "editDisposalFee";
      const sId = mode === "add" ? "sortDiscount" : "editSortDiscount";
      const aId = mode === "add" ? "amount" : "editAmount";

      const c = parseFloat(document.getElementById(cId).value) || 0;
      const d = parseFloat(document.getElementById(dId).value) || 0;
      const s = parseFloat(document.getElementById(sId).value) || 0;
      document.getElementById(aId).value = Math.max(0, c + d - s);
    }

    function setLoading(isLoading) {
      const bar = document.getElementById("loadingBar");
      if (bar) bar.classList.toggle("hidden", !isLoading);
    }

    async function loadData(showToast = false) {
      setLoading(true);
      try {
        const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
        const json = await res.json();
        if (json.status === "success") {
          allRecords = (json.data || []).map((item, idx) => {
            const cFee = Number(item.collectFee) || 0;
            const dFee = Number(item.disposalFee) || 0;
            const disc = Number(item.discount) || 0;
            const amt = Number(item.amount) || 0;
            return {
              ...item,
              id: idx + 1,
              collectFee: cFee,
              disposalFee: dFee,
              discount: disc,
              amount: amt,
              phone: item.phone || "-",
              binId: item.binId || "-",
              houseNo: item.houseNo || "-",
              regDate: item.regDate || "-",
              status: item.status || "ปกติ"
            };
          });
          allLogs = json.logs || [];
          renderAll();
          if (showToast) console.log("ซิงค์ข้อมูลสำเร็จ:", allRecords.length);
        }
      } catch (err) {
        console.error("Error loading data:", err);
      } finally {
        setLoading(false);
      }
    }

    function normalizeBin(bin) {
      const s = String(bin || "").trim();
      if (!s || s === "-" || s === "ไม่มี") return "";
      return s.toUpperCase();
    }

    function extractBinYear(bin) {
      const norm = normalizeBin(bin);
      if (!norm) return "NONE";
      const match = norm.match(/\/(25\d{2})/);
      if (match) return match[1];
      return "OLD";
    }

    function computeBinAnalytics(activeRecords) {
      const binMap = {};
      activeRecords.forEach(r => {
        const key = normalizeBin(r.binId);
        if (!key) return;
        if (!binMap[key]) binMap[key] = [];
        binMap[key].push(r);
      });

      const sharedBinKeys = new Set();
      const sharedGroups = [];

      Object.keys(binMap).forEach(key => {
        const group = binMap[key];
        if (group.length > 1) {
          sharedBinKeys.add(key);
          sharedGroups.push({ binCode: group[0].binId, members: group });
        }
      });

      const noBinRecords = activeRecords.filter(r => !normalizeBin(r.binId));
      const sharedRecords = activeRecords.filter(r => sharedBinKeys.has(normalizeBin(r.binId)));
      const uniqueBinsCount = Object.keys(binMap).length + noBinRecords.length;

      const yearCounts = {};
      let oldBinsCount = 0;

      Object.keys(binMap).forEach(key => {
        const yr = extractBinYear(key);
        if (yr === "OLD") {
          oldBinsCount += 1;
        } else if (/^25\d{2}$/.test(yr)) {
          yearCounts[yr] = (yearCounts[yr] || 0) + 1;
        }
      });

      const currentThaiYear = new Date().getFullYear() + 543;
      const maxYear = Math.max(2569, currentThaiYear, ...Object.keys(yearCounts).map(Number));
      const yearsList = [];
      for (let y = 2568; y <= maxYear; y++) {
        yearsList.push(String(y));
      }

      return {
        uniqueBinsCount,
        noBinRecords,
        sharedRecords,
        sharedGroups,
        yearCounts,
        yearsList,
        oldBinsCount
      };
    }

    function renderAll() {
      const active = allRecords.filter(r => r.status !== "ยกเลิก");
      const households = active.filter(r => r.customerType === "ครัวเรือน").length;
      const establishments = active.length - households;
      const totalAmount = active.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
      const sumCollect = active.reduce((sum, r) => sum + (Number(r.collectFee) || 0), 0);
      const sumDisposal = active.reduce((sum, r) => sum + (Number(r.disposalFee) || 0), 0);
      const sumDiscount = active.reduce((sum, r) => sum + (Number(r.discount) || 0), 0);

      const editLogsCount = allLogs.filter(l => String(l.actionType || "").includes("แก้ไข")).length;
      const cancelRecords = allRecords.filter(r => r.status === "ยกเลิก");

      const binStats = computeBinAnalytics(active);

      document.getElementById("statTotalHouseholds").textContent = households.toLocaleString() + " ราย";
      document.getElementById("statTotalEstablishments").textContent = establishments.toLocaleString() + " แห่ง";
      document.getElementById("statTotalBinsAllTypes").textContent = binStats.uniqueBinsCount.toLocaleString() + " ใบ";
      document.getElementById("statTotalAmount").textContent = "฿" + totalAmount.toLocaleString();
      document.getElementById("statTotalActive").textContent = active.length.toLocaleString();

      document.getElementById("sumCollectionFee").textContent = "฿" + sumCollect.toLocaleString();
      document.getElementById("sumDisposalFee").textContent = "฿" + sumDisposal.toLocaleString();
      document.getElementById("sumSortDiscount").textContent = "฿" + sumDiscount.toLocaleString();
      document.getElementById("sumEditOnly").textContent = editLogsCount.toLocaleString() + " ครั้ง";
      document.getElementById("sumCancelOnly").textContent = cancelRecords.length.toLocaleString() + " รายการ";

      document.getElementById("badgeTotalBins").textContent = binStats.uniqueBinsCount.toLocaleString();
      document.getElementById("badgeNoBin").textContent = binStats.noBinRecords.length.toLocaleString();
      document.getElementById("badgeSharedBin").textContent = binStats.sharedRecords.length.toLocaleString();

      renderBinBreakdownCards(binStats);
      renderSharedBinGroups(binStats.sharedGroups);
      renderTypeBreakdownCards(active);
      renderDashboardVillageSummary(active);
      renderBarChart(active);
      renderProportions(households, establishments, active.length);
      renderPriceBreakdown(active);
      renderTable();
      renderVillageCards(active);
      renderHistoryTable();
    }

    function renderBinBreakdownCards(binStats) {
      const container = document.getElementById("binBreakdownCards");
      let html = "";

      html += `
        <button type="button" onclick="openSourceModal('ALL_BINS_ACTIVE')" class="bg-slate-900/90 hover:bg-slate-800 border border-teal-500/40 rounded-xl p-3.5 text-left transition cursor-pointer">
          <div class="text-xs text-teal-300 font-semibold">ผลรวมถังทั้งหมด</div>
          <div class="text-xl font-extrabold text-white mt-1">${binStats.uniqueBinsCount.toLocaleString()} <span class="text-xs font-normal text-slate-400">ใบ</span></div>
          <div class="text-[11px] text-slate-400 mt-1">รวมไม่มีเลขถัง</div>
        </button>
      `;

      html += `
        <button type="button" onclick="openSourceModal('NO_BIN')" class="bg-slate-900/90 hover:bg-slate-800 border border-amber-500/40 rounded-xl p-3.5 text-left transition cursor-pointer">
          <div class="text-xs text-amber-300 font-semibold">ไม่มีเลขถังขยะ</div>
          <div class="text-xl font-extrabold text-amber-300 mt-1">${binStats.noBinRecords.length.toLocaleString()} <span class="text-xs font-normal text-slate-400">รายการ</span></div>
          <div class="text-[11px] text-slate-400 mt-1">คลิกดูรายชื่อ</div>
        </button>
      `;

      html += `
        <button type="button" onclick="openSourceModal('BIN_SHARED')" class="bg-slate-900/90 hover:bg-slate-800 border border-cyan-500/40 rounded-xl p-3.5 text-left transition cursor-pointer">
          <div class="text-xs text-cyan-300 font-semibold">ถังร่วม</div>
          <div class="text-xl font-extrabold text-cyan-300 mt-1">${binStats.sharedRecords.length.toLocaleString()} <span class="text-xs font-normal text-slate-400">รายการ</span></div>
          <div class="text-[11px] text-slate-400 mt-1">${binStats.sharedGroups.length} กลุ่มถังร่วม</div>
        </button>
      `;

      binStats.yearsList.forEach(yr => {
        const cnt = binStats.yearCounts[yr] || 0;
        html += `
          <button type="button" onclick="openSourceModal('BIN_YEAR:${yr}')" class="bg-slate-900/90 hover:bg-slate-800 border border-emerald-500/30 rounded-xl p-3.5 text-left transition cursor-pointer">
            <div class="text-xs text-emerald-300 font-semibold">ปี พ.ศ. ${yr}</div>
            <div class="text-xl font-extrabold text-white mt-1">${cnt.toLocaleString()} <span class="text-xs font-normal text-slate-400">ถัง</span></div>
            <div class="text-[11px] text-emerald-400/80 mt-1">คลิกดูรายการ</div>
          </button>
        `;
      });

      html += `
        <button type="button" onclick="openSourceModal('BIN_OLD')" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-left transition cursor-pointer">
          <div class="text-xs text-slate-300 font-semibold">ถังเก่า / ไม่ระบุปี</div>
          <div class="text-xl font-extrabold text-slate-200 mt-1">${binStats.oldBinsCount.toLocaleString()} <span class="text-xs font-normal text-slate-400">ถัง</span></div>
          <div class="text-[11px] text-slate-400 mt-1">คลิกดูรายการ</div>
        </button>
      `;

      container.innerHTML = html;
    }

    function renderSharedBinGroups(groups) {
      const container = document.getElementById("sharedBinGroupsList");
      if (!groups || groups.length === 0) {
        container.innerHTML = '<div class="text-slate-400 col-span-full">ไม่มีข้อมูลถังร่วมในข้อมูลปัจจุบัน</div>';
        return;
      }

      container.innerHTML = groups.map(g => {
        const namesHtml = g.members.map(m => {
          const others = g.members.filter(x => x !== m).map(x => `${x.fullName} (${x.village})`);
          return `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 py-1 border-b border-slate-800/80 last:border-0">
            <span class="text-white font-medium">${m.fullName} <span class="text-slate-400 text-[11px]">[${m.village} บ.เลขที่ ${m.houseNo} • โทร ${m.phone}]</span></span>
            <span class="text-cyan-300 text-[11px]">ใช้ร่วมกับ: ${others.join(", ")}</span>
          </div>`;
        }).join("");

        return `
          <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-cyan-300">เลขถัง: ${g.binCode}</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">${g.members.length} รายการ</span>
            </div>
            <div class="space-y-1">${namesHtml}</div>
          </div>
        `;
      }).join("");
    }

    function renderTypeBreakdownCards(active) {
      const container = document.getElementById("typeBreakdownCards");
      const counts = {};
      STANDARD_TYPES.forEach(t => counts[t] = 0);

      active.forEach(r => {
        const t = r.customerType || "ครัวเรือน";
        if (STANDARD_TYPES.includes(t)) {
          counts[t] += 1;
        } else {
          counts["อื่นๆ"] += 1;
        }
      });

      container.innerHTML = STANDARD_TYPES.map(t => `
        <button type="button" onclick="openSourceModal('TYPE:${t}')" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-emerald-500/40 rounded-xl p-3.5 text-left transition cursor-pointer">
          <div class="text-xs text-slate-400 truncate">${t}</div>
          <div class="text-xl font-bold text-emerald-400 mt-1">${(counts[t] || 0).toLocaleString()} <span class="text-xs font-normal text-slate-400">ราย</span></div>
        </button>
      `).join("");
    }

    function renderDashboardVillageSummary(active) {
      const tbody = document.getElementById("dashboardVillageSummaryBody");
      const binStats = computeBinAnalytics(active);

      let totalH = 0, totalE = 0, totalNoBin = 0, totalSharedGrp = 0, totalRec = 0, totalAmt = 0;

      const rowsHtml = Object.keys(VILLAGE_NAMES).map(vNum => {
        const vRecs = active.filter(r => String(r.villageNum) === vNum || String(r.village || "").includes("หมู่ " + vNum));
        const hCount = vRecs.filter(r => r.customerType === "ครัวเรือน").length;
        const eCount = vRecs.length - hCount;
        const noBinCount = vRecs.filter(r => !normalizeBin(r.binId)).length;

        const vBinMap = {};
        vRecs.forEach(r => {
          const b = normalizeBin(r.binId);
          if (b) vBinMap[b] = (vBinMap[b] || 0) + 1;
        });
        const sharedGrpCount = Object.values(vBinMap).filter(c => c > 1).length;
        const uniqueBinsInV = Object.keys(vBinMap).length + noBinCount;

        totalRec += vRecs.length;
        totalAmt += amtSum;

        return `

    function scheduleTableRender() {
      clearTimeout(renderTimeout);
      renderTimeout = setTimeout(() => {

        renderTable();

    function getFilteredRecords() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const typeFilter = document.getElementById("filterCustomerType").value;
      const villFilter = document.getElementById("filterVillage").value;

      return allRecords.filter(r => {
        if (typeFilter) {
          if (typeFilter === "อื่นๆ") {
            if (STANDARD_TYPES.includes(r.customerType) && r.customerType !== "อื่นๆ") return false;
          } else if (r.customerType !== typeFilter) {
            return false;
          }
        }
        if (villFilter) {
          const vMatch = villFilter.match(/\d+/);
          const vNum = vMatch ? vMatch[0] : "";
          if (String(r.villageNum) !== vNum && !String(r.village || "").includes(villFilter)) return false;
        }
        if (q) {
          const hay = [
            r.regDate, r.binId, r.fullName, r.phone, r.houseNo,
            r.village, r.villageFull, r.customerType, r.amount, r.status
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderTable() {
      const filtered = getFilteredRecords();
      const totalItems = filtered.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));
      if (currentPage > totalPages) currentPage = totalPages;

      const startIdx = (currentPage - 1) * rowsPerPage;
      const pageItems = filtered.slice(startIdx, startIdx + rowsPerPage);

      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = pageItems.map((r, i) => {
        const isCancel = r.status === "ยกเลิก";
        const cFee = Number(r.collectFee) || 0;
        const dFee = Number(r.disposalFee) || 0;
        const disc = Number(r.discount) || 0;
        const amt = Number(r.amount) || 0;

        return `
          <tr class="hover:bg-slate-800/40 transition ${isCancel ? "opacity-60 bg-rose-950/10" : ""}">
            <td class="p-3.5 text-slate-400">${startIdx + i + 1}</td>
            <td class="p-3.5 whitespace-nowrap">${r.regDate}</td>
            <td class="p-3.5 whitespace-nowrap font-medium text-emerald-300">${r.binId}</td>
            <td class="p-3.5 font-semibold text-white">${r.fullName}</td>
            <td class="p-3.5 whitespace-nowrap">${r.houseNo}</td>
            <td class="p-3.5 whitespace-nowrap text-slate-300">${r.phone || "-"}</td>
            <td class="p-3.5 whitespace-nowrap text-slate-300">${r.villageFull || r.village}</td>
            <td class="p-3.5">${r.customerType}</td>
            <td class="p-3.5 text-right whitespace-nowrap">฿${cFee.toLocaleString()}</td>
            <td class="p-3.5 text-right whitespace-nowrap text-cyan-300">฿${dFee.toLocaleString()}</td>
            <td class="p-3.5 text-right whitespace-nowrap text-lime-300">฿${disc.toLocaleString()}</td>
            <td class="p-3.5 text-right whitespace-nowrap font-bold text-emerald-400">฿${amt.toLocaleString()}</td>
            <td class="p-3.5 text-center whitespace-nowrap">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isCancel ? "bg-rose-500/20 text-rose-300 border border-rose-500/30" : "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"}">
                ${r.status}
              </span>
            </td>
            <td class="p-3.5 text-center whitespace-nowrap">
              <div class="inline-flex gap-1.5">
                <button type="button" onclick="openEditModal(${r.id})" class="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 text-xs font-semibold cursor-pointer">
                  แก้ไข
                </button>
                ${!isCancel ? `
                  <button type="button" onclick="openCancelModal(${r.id})" class="px-2.5 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">
                    ยกเลิก
                  </button>
                ` : ""}
              </div>
            </td>
          </tr>
        `;
      }).join("") || '<tr><td colspan="14" class="p-6 text-center text-slate-400">ไม่พบข้อมูลที่ค้นหา</td></tr>';

      const showStart = totalItems === 0 ? 0 : startIdx + 1;
      const showEnd = Math.min(totalItems, startIdx + pageItems.length);
      document.getElementById("pageInfo").textContent = `แสดง ${showStart} - ${showEnd} จากทั้งหมด ${totalItems.toLocaleString()} รายการ`;

      const pagEl = document.getElementById("paginationControls");
      let pagHtml = "";
      for (let p = 1; p <= totalPages; p++) {
        if (totalPages > 12 && p > 3 && p < totalPages - 2 && Math.abs(p - currentPage) > 1) {
          if (p === 4 || p === totalPages - 3) pagHtml += `<span class="px-2 py-1 text-slate-500">...</span>`;
          continue;
        }
        pagHtml += `<button type="button" onclick="currentPage=${p}; renderTable()" class="px-3 py-1 rounded-lg text-xs font-semibold border ${p === currentPage ? "bg-emerald-600 text-white border-emerald-500" : "bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800"}">${p}</button>`;
      }
      pagEl.innerHTML = pagHtml;
    }

    async function handleAddSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;

      const payload = {
        action: "add",
        regDate: document.getElementById("regDate").value.trim() || "-",
        binId: document.getElementById("binId").value.trim() || "-",
        fullName: document.getElementById("fullName").value.trim(),
        phone: document.getElementById("phone").value.trim() || "-",
        houseNo: document.getElementById("houseNo").value.trim(),
        village: document.getElementById("village").value,
        customerType: getSelectedCustomerType("add"),
        collectFee: Number(document.getElementById("collectionFee").value) || 0,
        disposalFee: Number(document.getElementById("disposalFee").value) || 0,
        discount: Number(document.getElementById("sortDiscount").value) || 0,
        amount: Number(document.getElementById("amount").value) || 0,
        status: "ปกติ",
        adminRole: currentRole
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        document.getElementById("addForm").reset();
        document.getElementById("collectionFee").value = 0;
        document.getElementById("disposalFee").value = 0;
        document.getElementById("sortDiscount").value = 0;
        document.getElementById("amount").value = 0;
        setTimeout(() => loadData(true), 1200);
      } finally {
        btn.disabled = false;
      }
    }

      document.getElementById("editBinId").value = r.binId === "-" ? "" : r.binId;
      document.getElementById("editFullName").value = r.fullName;
      document.getElementById("editPhone").value = r.phone === "-" ? "" : r.phone;
      document.getElementById("editHouseNo").value = r.houseNo;
      document.getElementById("editVillage").value = VILLAGE_NAMES[r.villageNum] || r.villageFull || "หมู่ 1 บ้านห้วยขวาง";

      const sel = document.getElementById("editCustomerTypeSelect");
      const detail = document.getElementById("editCustomerTypeDetail");
      if (STANDARD_TYPES.includes(r.customerType)) {
        sel.value = r.customerType;
        detail.value = "";
        detail.classList.add("hidden");
      } else {
        sel.value = "อื่นๆ";
        detail.value = r.customerType;
        detail.classList.remove("hidden");
      }

      document.getElementById("editCollectionFee").value = Number(r.collectFee) || 0;
      document.getElementById("editDisposalFee").value = Number(r.disposalFee) || 0;
      document.getElementById("editSortDiscount").value = Number(r.discount) || 0;
      document.getElementById("editAmount").value = Number(r.amount) || 0;
      document.getElementById("editStatus").value = r.status || "ปกติ";
      document.getElementById("editReason").value = "";

      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    async function handleEditSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveEdit");
      btn.disabled = true;

      const payload = {
        action: "edit",
        rowNumber: document.getElementById("editRowNumber").value,
        sheetName: document.getElementById("editSheetName").value,
        regDate: document.getElementById("editRegDate").value.trim() || "-",
        binId: document.getElementById("editBinId").value.trim() || "-",
        fullName: document.getElementById("editFullName").value.trim(),
        phone: document.getElementById("editPhone").value.trim() || "-",
        houseNo: document.getElementById("editHouseNo").value.trim(),
        village: document.getElementById("editVillage").value,
        customerType: getSelectedCustomerType("edit"),
        collectFee: Number(document.getElementById("editCollectionFee").value) || 0,
        disposalFee: Number(document.getElementById("editDisposalFee").value) || 0,
        discount: Number(document.getElementById("editSortDiscount").value) || 0,
        amount: Number(document.getElementById("editAmount").value) || 0,
        status: document.getElementById("editStatus").value,
        detail: document.getElementById("editReason").value.trim(),
        adminRole: currentRole
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        closeEditModal();
        setTimeout(() => loadData(true), 1200);
      } finally {
        btn.disabled = false;
      }
    }

    function openCancelModal(id) {
      const r = allRecords.find(x => x.id === id);
      if (!r) return;

      document.getElementById("cancelRowNumber").value = r.rowNumber;
      document.getElementById("cancelSheetName").value = r.sheetName;
      document.getElementById("cancelVillage").value = r.village;
      document.getElementById("cancelBinId").value = r.binId;
      document.getElementById("cancelHouseNo").value = r.houseNo;
      document.getElementById("cancelFullName").value = r.fullName;
      document.getElementById("cancelDisplayInfo").textContent = `${r.fullName} (บ.เลขที่ ${r.houseNo} • ${r.villageFull || r.village} • เลขถัง ${r.binId})`;

      const now = new Date();
      document.getElementById("cancelDateInput").value = `${now.getDate()}.${now.getMonth() + 1}.${now.getFullYear() + 543}`;
      document.getElementById("cancelReasonInput").value = "";

      document.getElementById("cancelModal").classList.remove("hidden");
    }

    function closeCancelModal() {
      document.getElementById("cancelModal").classList.add("hidden");
    }

    async function handleCancelSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnConfirmCancel");
      btn.disabled = true;

      const payload = {
        action: "cancel",
        rowNumber: document.getElementById("cancelRowNumber").value,
        sheetName: document.getElementById("cancelSheetName").value,
        village: document.getElementById("cancelVillage").value,
        binId: document.getElementById("cancelBinId").value,
        houseNo: document.getElementById("cancelHouseNo").value,
        fullName: document.getElementById("cancelFullName").value,
        cancelDate: document.getElementById("cancelDateInput").value.trim(),
        detail: document.getElementById("cancelReasonInput").value.trim(),
        adminRole: currentRole
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        closeCancelModal();
        setTimeout(() => loadData(true), 1200);
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteHistoryLog(rowNumber, timestamp, fullName) {
      const payload = {
        action: "deleteLog",
        rowNumber,
        timestamp,
        fullName
      };
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      setTimeout(() => loadData(true), 1000);
    }
  </script>
</body>
</html>
