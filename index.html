<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนขยะ ตำบลศิลาลอย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', 'Sarabun', sans-serif; background-color: #f8fafc; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- GOOGLE SCRIPT URL CONFIG -->
   <script>
    // โหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
    let allData = [];

    async function loadDataFromSheet() {
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const result = await response.json();
            if (result.status === "success" && result.data) {
                allData = result.data;
                updateStats();
                renderTable();
            }
        } catch (error) {
            console.error("Error loading data:", error);
        }
    }

    // อัปเดตตัวเลขสถิติด้านบน
    function updateStats() {
        document.getElementById('stat-total-houses').innerText = allData.length;
        
        let totalRev = 0;
        let monthlyRev = 0;
        let monthlyCount = 0;
        let yearlyRev = 0;
        let yearlyCount = 0;

        allData.forEach(item => {
            const fee = Number(item.feeAmount) || 0;
            totalRev += fee;
            if (item.paymentType === 'monthly' || item.paymentType === 'รายเดือน') {
                monthlyRev += fee;
                monthlyCount++;
            } else {
                yearlyRev += fee;
                yearlyCount++;
            }
        });

        document.getElementById('stat-total-revenue').innerText = "฿" + totalRev.toLocaleString();
        document.getElementById('stat-monthly-revenue').innerText = "฿" + monthlyRev.toLocaleString();
        document.getElementById('stat-monthly-count').innerText = monthlyCount;
        document.getElementById('stat-yearly-revenue').innerText = "฿" + yearlyRev.toLocaleString();
        document.getElementById('stat-yearly-count').innerText = yearlyCount;
    }

    // แสดงตารางรายชื่อ
    function renderTable() {
        const keyword = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : "";
        const villageFilter = document.getElementById('filter-village') ? document.getElementById('filter-village').value : "";
        const tbody = document.getElementById('table-body');
        if (!tbody) return;

        tbody.innerHTML = "";

        let filtered = allData.filter(item => {
            const matchKeyword = (item.fullname && item.fullname.toLowerCase().includes(keyword)) ||
                                 (item.phone && item.phone.toLowerCase().includes(keyword)) ||
                                 (item.houseNo && item.houseNo.toLowerCase().includes(keyword)) ||
                                 (item.binCode && item.binCode.toLowerCase().includes(keyword));
            const matchVillage = villageFilter === "" || item.village == villageFilter;
            return matchKeyword && matchVillage;
        });

        document.getElementById('showing-count').innerText = filtered.length;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-400">ไม่พบข้อมูลในระบบ</td></tr>`;
            return;
        }

        filtered.forEach((item, index) => {
            tbody.innerHTML += `
                <tr class="bg-white border-b hover:bg-slate-50">
                    <td class="px-4 py-3 text-center font-medium">${index + 1}</td>
                    <td class="px-4 py-3 font-semibold text-emerald-700">${item.binCode || '-'}</td>
                    <td class="px-4 py-3">${item.fullname || '-'}</td>
                    <td class="px-4 py-3">${item.phone || '-'}</td>
                    <td class="px-4 py-3 text-center">ม.${item.village || '-'} (${item.houseNo || '-'})</td>
                    <td class="px-4 py-3 text-center"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-medium">${item.paymentType || 'รายเดือน'}</span></td>
                    <td class="px-4 py-3 text-right font-bold text-slate-700">฿${Number(item.feeAmount || 40).toLocaleString()}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="editData('${item.id}')" class="text-blue-600 hover:text-blue-800 mr-2"><i class="fa-solid fa-pen-to-square"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    // ฟังก์ชันสุ่มรหัสถังขยะ
    function generateBinCode() {
        const v = document.getElementById('village').value;
        if (!v) {
            alert('กรุณาเลือกหมู่บ้านก่อนสุ่มรหัสถังขยะ');
            return;
        }
        const randomNum = Math.floor(100 + Math.random() * 900);
        document.getElementById('bin-code').value = `SLL-M${v}-${randomNum}`;
    }

    // ฟังก์ชันบันทึกข้อมูลส่งไป Apps Script
    async function handleSaveData(e) {
        e.preventDefault();
        const data = {
            regDate: document.getElementById('reg-date').value,
            village: document.getElementById('village').value,
            houseNo: document.getElementById('house-no').value,
            fullname: document.getElementById('fullname').value,
            phone: document.getElementById('phone').value,
            feeAmount: document.getElementById('fee-amount').value,
            binCode: document.getElementById('bin-code').value,
            paymentType: document.getElementById('payment-type').value
        };

        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "save", data: data })
            });
            const result = await res.json();
            if(result.status === "success") {
                alert("บันทึกข้อมูลสำเร็จ!");
                resetForm();
                loadDataFromSheet();
            } else {
                alert("เกิดข้อผิดพลาดในการบันทึก");
            }
        } catch (err) {
            console.error(err);
            alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
        }
    }

    function resetForm() {
        document.getElementById('waste-form').reset();
        document.getElementById('fee-amount').value = "40";
    }

    // เริ่มต้นโหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
    window.onload = function() {
        loadDataFromSheet();
    };
</script>
